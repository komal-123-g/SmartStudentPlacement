<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .login-container {
            max-width: 450px;
            margin: 80px auto;
            padding: 20px;
        }
        
        .login-card {
            background: white;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }
        
        .login-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }
        
        .login-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }
        
        .login-card p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
        }
        
        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .register-link {
            text-align: center;
            margin-top: 22px;
        }
        
        .register-link a {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }
        
        .home-link {
            text-align: center;
            margin-top: 15px;
        }
        
        .home-link a {
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-icon">
                🏢
            </div>

            <h1>Company Login</h1>

            <p>
                Login to manage your company and job postings.
            </p>


            <form method="POST" action="{{ url_for('company_login') }}">

                <div class="form-group">

                    <label>📧 Email</label>

                    <input type="email" name="email" placeholder="Enter company email" required>

                </div>


                <div class="form-group">

                    <label>🔐 Password</label>

                    <input type="password" name="password" placeholder="Enter password" required>

                </div>


                <button type="submit" class="login-btn">

                🔑 Login

            </button>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="{{ url_for('company_register') }}">
                Register Company
            </a>

            </div>


            <div class="home-link">

                <a href="{{ url_for('home') }}">
                ← Back to Home
            </a>

            </div>

        </div>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Register</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .register-container {
            max-width: 550px;
            margin: 50px auto;
            padding: 20px;
        }
        
        .register-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }
        
        .register-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }
        
        .register-card p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .login-link a {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <h1>🏢 Company Registration</h1>

            <p>
                Register your company to post jobs and manage applicants.
            </p>

            <form method="POST" action="{{ url_for('company_register') }}">

                <div class="form-group">

                    <label>🏢 Company Name</label>

                    <input type="text" name="company_name" placeholder="Enter company name" required>

                </div>


                <div class="form-group">

                    <label>📧 Email</label>

                    <input type="email" name="email" placeholder="Enter company email" required>

                </div>


                <div class="form-group">

                    <label>📱 Mobile</label>

                    <input type="text" name="mobile" placeholder="Enter mobile number" maxlength="15" required>

                </div>


                <div class="form-group">

                    <label>🔐 Password</label>

                    <input type="password" name="password" placeholder="Create password" required>

                </div>


                <div class="form-group">

                    <label>📍 Location</label>

                    <input type="text" name="location" placeholder="Enter company location" required>

                </div>


                <div class="form-group">

                    <label>📝 Company Description</label>

                    <textarea name="description" placeholder="Enter company description" required></textarea>

                </div>


                <button type="submit" class="register-btn">

                🚀 Register Company

            </button>

            </form>


            <div class="login-link">

                Already registered?

                <a href="{{ url_for('company_login') }}">
                Company Login
            </a>

            </div>

        </div>

    </div>

</body>

</html>

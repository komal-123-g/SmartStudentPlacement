<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post Job | Smart Student Placement</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .job-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        
        .job-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .job-header h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }
        
        .job-header p {
            color: #666;
        }
        
        .job-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
        }
        
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .post-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .post-btn:hover {
            opacity: 0.9;
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="container">

            <div class="nav-brand">
                🏢 Smart Student Placement
            </div>

            <div class="nav-links">

                <a href="{{ url_for('company_dashboard') }}">
                Dashboard
            </a>

                <a href="{{ url_for('company_profile') }}">
                Profile
            </a>

                <a href="{{ url_for('post_job') }}">
                Post Job
            </a>

                <a href="{{ url_for('company_jobs') }}">
                My Jobs
            </a>

                <a href="{{ url_for('company_applicants') }}">
                Applicants
            </a>

                <a href="{{ url_for('logout') }}">
                Logout
            </a>

            </div>

        </div>

    </nav>


    <!-- ================= POST JOB ================= -->

    <div class="job-container">

        <div class="job-header">

            <h1>📢 Post a New Job</h1>

            <p>
                Add a job opportunity for students.
            </p>

        </div>


        <div class="job-card">

            <form method="POST" action="{{ url_for('post_job') }}">

                <!-- Job Title -->

                <div class="form-group">

                    <label>💼 Job Title</label>

                    <input type="text" name="job_title" placeholder="Example: Java Developer" required>

                </div>


                <!-- Location -->

                <div class="form-group">

                    <label>📍 Location</label>

                    <input type="text" name="location" placeholder="Example: Pune" required>

                </div>


                <!-- Job Type -->

                <div class="form-group">

                    <label>🕒 Job Type</label>

                    <select name="job_type" required>

                    <option value="">
                        Select Job Type
                    </option>

                    <option value="Full Time">
                        Full Time
                    </option>

                    <option value="Part Time">
                        Part Time
                    </option>

                    <option value="Internship">
                        Internship
                    </option>

                </select>

                </div>


                <!-- Required Course -->

                <div class="form-group">

                    <label>🎓 Required Course</label>

                    <input type="text" name="required_course" placeholder="Example: BSc Computer Science, BSc IT" required>

                </div>


                <!-- Minimum CGPA -->

                <div class="form-group">

                    <label>📊 Minimum CGPA</label>

                    <input type="number" name="min_cgpa" step="0.01" min="0" max="10" placeholder="Example: 6.00" required>

                </div>


                <!-- Required Skills -->

                <div class="form-group">

                    <label>🛠️ Required Skills</label>

                    <input type="text" name="required_skills" placeholder="Example: Java, MySQL, OOP" required>

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label>📝 Job Description</label>

                    <textarea name="description" placeholder="Enter job description and responsibilities" required></textarea>

                </div>


                <!-- Submit -->

                <button type="submit" class="post-btn">

                🚀 Post Job

            </button>

            </form>


            <a href="{{ url_for('company_dashboard') }}" class="back-link">

            ← Back to Company Dashboard

        </a>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 Smart Student Placement Management System
        </p>

    </footer>

</body>

</html>

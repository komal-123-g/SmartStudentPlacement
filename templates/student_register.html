<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | Smart Placement</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <h2>🎓 Smart Placement</h2>

        <div>

            <a href="/">Home</a>

            <a href="/student/login">Student Login</a>

            <a href="/company/login">Company</a>

            <a href="/admin/login">Admin</a>

        </div>

    </nav>



    <!-- ================= REGISTER ================= -->

    <div class="auth-container">

        <div class="auth-card">


            <div style="text-align:center; font-size:50px;">
                🎓
            </div>


            <h1>
                Student Registration
            </h1>


            <p style="text-align:center; margin-bottom:25px;">
                Create your student account
            </p>


            <form method="POST" action="/student/register">


                <!-- NAME -->

                <label>
                Full Name
            </label>

                <input type="text" name="name" placeholder="Enter your full name" required>


                <!-- EMAIL -->

                <label>
                Email Address
            </label>

                <input type="email" name="email" placeholder="Enter your email" required>


                <!-- MOBILE -->

                <label>
                Mobile Number
            </label>

                <input type="text" name="mobile" placeholder="Enter your mobile number" required>


                <!-- PASSWORD -->

                <label>
                Password
            </label>

                <input type="password" name="password" placeholder="Create a password" required>


                <!-- COURSE -->

                <label>
                Course
            </label>

                <input type="text" name="course" placeholder="Example: BSc Computer Science" required>


                <!-- CGPA -->

                <label>
                CGPA
            </label>

                <input type="number" name="cgpa" step="0.01" min="0" max="10" placeholder="Enter your CGPA" required>


                <!-- SKILLS -->

                <label>
                Skills
            </label>

                <input type="text" name="skills" placeholder="Example: Java, MySQL, Python" required>


                <br><br>


                <!-- REGISTER BUTTON -->

                <button type="submit" style="width:100%;">

                ✨ Create Student Account

            </button>


            </form>


            <!-- LOGIN LINK -->

            <p style="text-align:center; margin-top:25px;">

                Already have an account?

                <a href="/student/login">
                    <b>Login Here</b>
                </a>

            </p>


            <!-- HOME LINK -->

            <p style="text-align:center; margin-top:15px;">

                <a href="/">
                ← Back to Home
            </a>

            </p>


        </div>

    </div>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 Smart Student Placement Management System
        </p>

        <p>
            Manage Your Career. Find Your Opportunity.
        </p>

    </footer>


</body>

</html>
